# wsc-contracts@2.3.3 — 错误码目录
# 与 contracts/openapi/openapi.yaml 示例及统一响应包装一致
# 继承 V1.1；V1.3 新增 ERR_IMPORT_TEMPLATE_UNSUPPORTED（旧模板/非 v0729 表头整文件拒绝）
# V2.2：行业分类改为 industryCategory 门类枚举；ERR_CATEGORY_LEAF_REQUIRED 仅用于显式非法 L3 / 维护关联
# V2.2.0（SNAP-WSC-005）：切角色禁用、用户管理冲突/404

version: "2.3.3"
package: wsc-contracts

codes:
  ERR_PRODUCT_CODE_FORMAT:
    httpStatus: 400
    code: ERR_PRODUCT_CODE_FORMAT
    message: "产品编码格式非法，须符合 {DOMAIN}-{FEATURE}-{NNNN}"
    refs: [DEC-WSC-001, REQ-CAT-004, REQ-CAT-005, REQ-CAT-008]

  ERR_PRODUCT_CODE_CONFLICT:
    httpStatus: 409
    code: ERR_PRODUCT_CODE_CONFLICT
    message: "产品编码已存在"
    refs: [DEC-WSC-001, REQ-CAT-005, REQ-CAT-008]

  ERR_CATEGORY_HAS_PRODUCTS:
    httpStatus: 409
    code: ERR_CATEGORY_HAS_PRODUCTS
    message: "分类下仍有挂载产品，禁止删除"
    dataFields: [reason, productCount]
    refs: [DEC-WSC-003, REQ-CAT-006]

  ERR_CATEGORY_LEAF_REQUIRED:
    httpStatus: 400
    code: ERR_CATEGORY_LEAF_REQUIRED
    message: "产品须挂载三级分类节点"
    refs: [REQ-CAT-005, REQ-CAT-007]

  ERR_MAINTENANCE_FORBIDDEN:
    httpStatus: 403
    code: ERR_MAINTENANCE_FORBIDDEN
    message: "当前角色无权执行目录维护"
    refs: [REQ-RBAC-001, REQ-CAT-007]

  ERR_IMPORT_FILE_TOO_LARGE:
    httpStatus: 400
    code: ERR_IMPORT_FILE_TOO_LARGE
    message: "导入文件超过 10MB"
    scope: request
    refs: [REQ-CAT-008, PLAN-WSC-2.2 §3.1, PLAN-WSC-4.1 §3.2]

  ERR_IMPORT_FORMAT_INVALID:
    httpStatus: 400
    code: ERR_IMPORT_FORMAT_INVALID
    message: "无法解析文件或非 xlsx/csv"
    scope: request
    refs: [REQ-CAT-008, PLAN-WSC-2.2 §3.1, PLAN-WSC-4.1 §3.2]

  ERR_IMPORT_TEMPLATE_UNSUPPORTED:
    httpStatus: 400
    code: ERR_IMPORT_TEMPLATE_UNSUPPORTED
    message: "导入模板不受支持：表头须为 v0729 权威列名行"
    scope: request
    refs: [REQ-CAT-008, PLAN-WSC-4.1 §3.1, PLAN-WSC-4.1 §3.2, OQ-V13-001]

  ERR_IMPORT_ROW_INVALID:
    httpStatus: null
    code: ERR_IMPORT_ROW_INVALID
    message: "行级校验失败（仅出现在错误报告内，不作整单 HTTP envelope code）"
    scope: report-row
    refs: [REQ-CAT-008, PLAN-WSC-2.2 §3.1 ISSUE-API-R1-004]

  ERR_IMPORT_REPORT_NOT_FOUND:
    httpStatus: 404
    code: ERR_IMPORT_REPORT_NOT_FOUND
    message: "错误报告不存在或已过期"
    refs: [REQ-CAT-008, PLAN-WSC-2.2 §3.5]

  ERR_FORBIDDEN:
    httpStatus: 403
    code: ERR_FORBIDDEN
    message: "当前角色无权执行该写操作"
    refs: [REQ-RBAC-001, REQ-USER-001]

  ERR_ROLE_SWITCH_DISABLED:
    httpStatus: 410
    code: ERR_ROLE_SWITCH_DISABLED
    message: "角色由账号绑定，禁止会话切换"
    refs: [REQ-SHELL-001, SNAP-WSC-005, PLAN-WSC-5.2 §3.1]

  ERR_USER_USERNAME_CONFLICT:
    httpStatus: 409
    code: ERR_USER_USERNAME_CONFLICT
    message: "用户名已存在"
    refs: [REQ-USER-001, PLAN-WSC-5.2 §3.1]

  ERR_USER_NOT_FOUND:
    httpStatus: 404
    code: ERR_USER_NOT_FOUND
    message: "用户不存在"
    refs: [REQ-USER-001, PLAN-WSC-5.2 §3.1]

  # ── V1.7 订单错误码（SNAP-WSC-009 / PLAN-WSC-9.2）──

  ERR_ORDER_NOT_FOUND:
    httpStatus: 404
    code: ERR_ORDER_NOT_FOUND
    message: "订单不存在"
    refs: [REQ-WSC-ORDER-009, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_FORBIDDEN:
    httpStatus: 403
    code: ERR_ORDER_FORBIDDEN
    message: "当前角色无权操作此订单"
    refs: [REQ-WSC-ORDER-001, REQ-WSC-ORDER-011, PLAN-WSC-9.2 §4]

  ERR_ORDER_INVALID_STATE:
    httpStatus: 400
    code: ERR_ORDER_INVALID_STATE
    message: "订单当前状态不允许执行此操作"
    refs: [REQ-WSC-ORDER-010, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_NOTICE_NOT_ACCEPTED:
    httpStatus: 400
    code: ERR_ORDER_NOTICE_NOT_ACCEPTED
    message: "须知未勾选，无法提交"
    refs: [REQ-WSC-ORDER-004, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_REMARK_EMPTY:
    httpStatus: 400
    code: ERR_ORDER_REMARK_EMPTY
    message: "备注不能为空"
    refs: [REQ-WSC-ORDER-006, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_SIMPLE_ORDER_NOT_ALLOWED:
    httpStatus: 400
    code: ERR_ORDER_SIMPLE_ORDER_NOT_ALLOWED
    message: "该产品不允许链内简易流程下单"
    refs: [REQ-WSC-ORDER-003, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_ATTACHMENT_INVALID:
    httpStatus: 400
    code: ERR_ORDER_ATTACHMENT_INVALID
    message: "附件格式非法，仅支持 Word/PDF"
    refs: [REQ-WSC-ORDER-013, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_ATTACHMENT_TOO_LARGE:
    httpStatus: 400
    code: ERR_ORDER_ATTACHMENT_TOO_LARGE
    message: "附件超过 20MB 限制"
    refs: [REQ-WSC-ORDER-013, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_ATTACHMENT_SCAN_FAILED:
    httpStatus: 400
    code: ERR_ORDER_ATTACHMENT_SCAN_FAILED
    message: "附件安全扫描未通过"
    refs: [REQ-WSC-ORDER-013, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_AMOUNT_INVALID:
    httpStatus: 400
    code: ERR_ORDER_AMOUNT_INVALID
    message: "金额校验失败（须为正数、两位小数、含税未税一致）"
    refs: [REQ-WSC-ORDER-014, PLAN-WSC-9.2 §3.1]

  ERR_ORDER_LINE_INVALID:
    httpStatus: 400
    code: ERR_ORDER_LINE_INVALID
    message: "计费明细校验失败（缺单位/数量/单价≤0/小计不正确）"
    refs: [REQ-WSC-ORDER-014, PLAN-WSC-9.2 §3.1]

envelope:
  fields: [code, message, data, correlationId]
  successCode: "0"

importSemantics:
  requestLevel:
    - ERR_IMPORT_FILE_TOO_LARGE
    - ERR_IMPORT_FORMAT_INVALID
    - ERR_IMPORT_TEMPLATE_UNSUPPORTED
  rowLevelInReportOnly: [ERR_IMPORT_ROW_INVALID]
  reportTtlHours: 24
  reportFieldsWhitelist: [rowNumber, productCode, reasonCode, reasonMessage]
