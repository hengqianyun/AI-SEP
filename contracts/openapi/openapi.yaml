openapi: 3.0.3
info:
  title: WSC Access Workbench API
  version: 2.3.3
  description: |
    wsc-contracts@2.3.3 — 接入端工作台 V1.6（SNAP-WSC-008 / PLAN-WSC-8.3 Wave B）。
    统一响应包装：{ code, message, data, correlationId }；成功时 code="0"。
    会话 SessionPrincipal 必填 enterpriseId + enterpriseName（REQ-USER-002）；scope 单一真源。
    GET /catalog/products 全链默认全平台（REQ-CAT-018）；mine=true → **本企业**产品（非 create_by-only）。
    GET /catalog/maintenance/entries 硬冻结 query scope=full|myCatalog：full=ADMIN 全量；myCatalog=ADMIN 本企业 / PROVIDER ownCreateBy；PROVIDER 调 full → 403。
    我的目录路由 `/my-catalog`；目录维护全量 `/catalog/maintenance`（仅 ADMIN）。
    RBAC：ADMIN 产品写/导入本企业 200；PROVIDER ownCreateBy；USER 403；PROVIDER 无目录维护 UI/API（scope=full）。
    GET /catalog/l2-distribution 可选 l1CategoryId；**不按**登录用户企业过滤。
    mine/myCatalog/写/维护 scope **仅**信服务端 SessionPrincipal；**拒绝/忽略**客户端 enterpriseId query/body 作授权依据。
    浏览 query 支持 l1CategoryId/l2CategoryId/l3CategoryId；浏览**不传** industryCategory（编辑/导入/详情仍用 INDUSTRY_CATEGORY_OPTIONS）。
    产品编码格式（DEC-WSC-001）：`{DOMAIN}-{FEATURE}-{NNNN}`。
    认证：服务端会话（Cookie）；写 API 以服务端会话角色为准。

servers:
  - url: /api/v1
    description: V1 API base

tags:
  - name: auth
  - name: overview
  - name: catalog
  - name: chain
  - name: admin

security:
  - SessionCookie: []

paths:
  /auth/session:
    get:
      tags: [auth]
      summary: 获取当前会话
      operationId: getSession
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSession"
              examples:
                ok:
                  value:
                    code: "0"
                    message: OK
                    data:
                      userId: "u-1"
                      displayName: "演示用户"
                      role: ADMIN
                      enterpriseId: "ent-demo-1"
                      enterpriseName: "演示企业"
                    correlationId: "corr-auth-1"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      summary: 登录建立会话
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功（Set-Cookie 会话）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [auth]
      summary: 登出（立即失效会话）
      operationId: deleteSession
      responses:
        "200":
          description: 已登出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"

  /auth/session/role:
    post:
      tags: [auth]
      summary: 会话角色切换（始终禁用）
      description: |
        V1.4 起角色仅由 sys_user 账号绑定；任意会话角色切换一律禁用。
        三角色（ADMIN/PROVIDER/USER）调用均返回 HTTP 410 + ERR_ROLE_SWITCH_DISABLED。
        本操作无成功路径。
      operationId: switchSessionRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchRoleRequest"
      responses:
        "410":
          description: 角色切换已永久禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                disabled:
                  summary: 任意角色均禁用
                  value:
                    code: ERR_ROLE_SWITCH_DISABLED
                    message: 角色由账号绑定，禁止会话切换
                    data: null
                    correlationId: "corr-role-switch-410"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /overview/metrics:
    get:
      tags: [overview]
      summary: 总览核心指标（REQ-OVW-001）
      operationId: getOverviewMetrics
      responses:
        "200":
          description: 指标卡片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOverviewMetrics"

  /overview/trend:
    get:
      tags: [overview]
      summary: 近 30 天上链趋势（REQ-OVW-002）
      operationId: getOverviewTrend
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: 趋势序列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOverviewTrend"

  /overview/top:
    get:
      tags: [overview]
      summary: 产品上链次数 TOP（REQ-OVW-003）
      operationId: getOverviewTop
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 10
      responses:
        "200":
          description: TOP 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOverviewTop"

  /overview/stream:
    get:
      tags: [overview]
      summary: 最新上链动态流（REQ-OVW-004）
      operationId: getOverviewStream
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: 动态流（V1 来自投影/fixture，不依赖未实现业务 API）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOverviewStream"

  /overview/distribution:
    get:
      tags: [overview]
      summary: 行业与地域分布（REQ-OVW-005）
      operationId: getOverviewDistribution
      responses:
        "200":
          description: 分布数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOverviewDistribution"

  /catalog/categories:
    get:
      tags: [catalog]
      summary: 行业分类树
      operationId: listCategories
      responses:
        "200":
          description: 一二三级分类（空间/行业/子类）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCategoryList"
    post:
      tags: [catalog]
      summary: 新增行业分类（管理员）
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCategory"
        "403":
          $ref: "#/components/responses/Forbidden"

  /catalog/categories/{categoryId}:
    put:
      tags: [catalog]
      summary: 更新行业分类（管理员）
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCategory"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [catalog]
      summary: 删除行业分类（管理员；有挂载产品则禁止）
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 分类下仍有产品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                hasProducts:
                  value:
                    code: ERR_CATEGORY_HAS_PRODUCTS
                    message: 分类下仍有挂载产品，禁止删除
                    data:
                      reason: 分类下仍有 3 个产品
                      productCount: 3
                    correlationId: "corr-cat-del-1"

  /catalog/l2-distribution:
    get:
      tags: [catalog]
      summary: 二级目录产品分布（座序图；REQ-CAT-009 / REQ-CAT-015）
      description: |
        返回全部产品真实总数 totalProducts，以及按产品数降序的 L2 条目 items[]
        （code/name/count）。消费方可截取 Top5。totalProducts 不得用 Top5 之和冒充。
        可选 l1CategoryId 将分布与 totalProducts 限定于该 L1 子树；**不按**登录用户企业过滤（REQ-CAT-018）。
      operationId: getL2Distribution
      parameters:
        - name: l1CategoryId
          in: query
          required: false
          schema: { type: string }
          description: 可选一级分类 id；空则全平台分布
      responses:
        "200":
          description: 按产品数降序的 L2 计数与产品总数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseL2Distribution"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users:
    get:
      tags: [admin]
      summary: 用户列表（仅 ADMIN；REQ-USER-001）
      description: |
        响应为命名 schema AdminUser[]；禁止回显 password / passwordHash。
        非 ADMIN → ERR_FORBIDDEN（403）。
      operationId: listUsers
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUserPage"
              examples:
                ok:
                  value:
                    code: "0"
                    message: OK
                    data:
                      items:
                        - userId: "u-1"
                          username: "admin"
                          displayName: "管理员"
                          role: ADMIN
                          enterpriseId: "ent-demo-1"
                          enterpriseName: "演示企业"
                          deleted: false
                    correlationId: "corr-users-list"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: 创建用户（仅 ADMIN；REQ-USER-001 / REQ-USER-002）
      description: |
        必填 username + password + role；可选 displayName / enterpriseName / enterpriseId。
        enterpriseId 可默认继承操作者企业。username 冲突 → ERR_USER_USERNAME_CONFLICT（409）。
        响应 AdminUser 禁止含 password / passwordHash。
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUser"
              examples:
                ok:
                  value:
                    code: "0"
                    message: OK
                    data:
                      userId: "u-2"
                      username: "provider1"
                      displayName: "提供方一"
                      role: PROVIDER
                      enterpriseId: "ent-demo-1"
                      enterpriseName: "演示企业"
                      deleted: false
                    correlationId: "corr-users-create"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: username 冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                conflict:
                  value:
                    code: ERR_USER_USERNAME_CONFLICT
                    message: 用户名已存在
                    data: null
                    correlationId: "corr-users-dup"

  /admin/users/{userId}:
    put:
      tags: [admin]
      summary: 更新用户角色/资料或软删（仅 ADMIN；REQ-USER-001）
      description: |
        可改角色、资料、密码；软删/启用权威形状为 PUT deleted: true/false。
        物理删除见同路径 DELETE（硬删行，与软删并存）。
        用户不存在 → ERR_USER_NOT_FOUND（404）。
        响应 AdminUser 禁止含 password / passwordHash。
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
            examples:
              softDelete:
                summary: 软删
                value:
                  deleted: true
              changeRole:
                summary: 改角色
                value:
                  role: USER
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAdminUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                notFound:
                  value:
                    code: ERR_USER_NOT_FOUND
                    message: 用户不存在
                    data: null
                    correlationId: "corr-users-404"
    delete:
      tags: [admin]
      summary: 物理删除用户（硬删；仅 ADMIN）
      description: |
        从 DB 物理删除该用户行，列表不再出现。软删/启用仍为 PUT deleted。
        禁止删除当前登录账号 → ERR_USER_DELETE_SELF（400）。
        用户不存在 → ERR_USER_NOT_FOUND（404）。
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已物理删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
              examples:
                ok:
                  value:
                    code: "0"
                    message: OK
                    data:
                      deleted: true
                    correlationId: "corr-users-hard-delete"
        "400":
          description: 禁止删除自身
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                deleteSelf:
                  value:
                    code: ERR_USER_DELETE_SELF
                    message: 不能删除当前登录账号
                    data: null
                    correlationId: "corr-users-delete-self"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                notFound:
                  value:
                    code: ERR_USER_NOT_FOUND
                    message: 用户不存在
                    data: null
                    correlationId: "corr-users-delete-404"

  /catalog/products:
    get:
      tags: [catalog]
      summary: 产品列表（筛选/搜索）
      description: |
        全链默认返回**全平台**产品（REQ-CAT-018）；**无**登录用户企业 filter。
        mine=true 时返回**本企业**产品（create_by 关联 sys_user.enterprise_id 与会话 enterpriseId 比较；非 create_by-only）。
        浏览筛选支持 l1CategoryId/l2CategoryId/l3CategoryId；**浏览不传** industryCategory（REQ-CAT-019；schema 保留供 editor/import）。
        supplierName：产品字段模糊匹配（与 q 语义分离；REQ-CAT-012）。
        排序：有 L3 在前、未分类殿后、updatedAt desc（跨页全局；V1.5 不回退）。
        `l3Counts`：当前筛选条件下各 L3（含 `__uncategorized__`）全集条数；分页只截断 `items`，不改变 count。
        scope 授权**仅**信 SessionPrincipal；客户端 enterpriseId/enterpriseName query **不得**作授权依据。
      operationId: listProducts
      parameters:
        - name: l1CategoryId
          in: query
          schema: { type: string }
        - name: l2CategoryId
          in: query
          schema: { type: string }
          description: 行业（二级）；可选
        - name: l3CategoryId
          in: query
          schema: { type: string }
          description: 子类（三级）；可选
        - name: industryCategory
          in: query
          schema: { type: string }
          description: GB/T 4754 门类中文原文（产品字段）；**浏览场景弃用**（REQ-CAT-019）；编辑/导入仍用
        - name: supplierName
          in: query
          schema: { type: string }
          description: 产品字段 supplierName 模糊匹配（大小写不敏感 contains）；与 q 语义分离（REQ-CAT-012）
        - name: dataSource
          in: query
          schema: { $ref: "#/components/schemas/DataSource" }
        - name: productType
          in: query
          schema: { $ref: "#/components/schemas/ProductType" }
        - name: involvesPublicData
          in: query
          schema: { type: boolean }
        - name: deliveryMethod
          in: query
          schema: { $ref: "#/components/schemas/DeliveryMethod" }
        - name: q
          in: query
          description: 产品名/编码包含匹配（大小写不敏感）
          schema: { type: string }
        - name: mine
          in: query
          description: true 时仅返回**本企业**产品（同 enterpriseId；REQ-CAT-016）
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductPage"
    post:
      tags: [catalog]
      summary: 新增数据产品（ADMIN 本企业 / PROVIDER ownCreateBy；USER → 403）
      description: |
        ADMIN 与 PROVIDER 可写：ADMIN 限本企业（ownEnterprise）；PROVIDER 限 create_by=当前用户。
        USER → ERR_FORBIDDEN（403）。归属 create_by 绑定当前会话 userId。
        授权 scope **仅**信 SessionPrincipal；客户端 enterpriseId **不得**扩大可见面。
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
            examples:
              dataset:
                summary: 数据集
                value:
                  productCode: MED-EMR-0002
                  productName: 电子病历数据集
                  productType: DATASET
                  industryCategory: 卫生和社会工作
                  l3CategoryId: "cat-l3-1"
                  typeSpecific:
                    dataset:
                      recordCount: 1000
              other:
                summary: 其他数据产品（允许 contentDescription）
                value:
                  productCode: GEN-MISC-0001
                  productName: 其他产品示例
                  productType: OTHER
                  industryCategory: 建筑业
                  typeSpecific:
                    other:
                      contentDescription: 其他数据产品内容说明
                      timeRange: "2026/01/01 -"
                      regionScope: 全国
              api:
                summary: 数据接口（OpenAPI 形状）
                value:
                  productCode: MED-API-0002
                  productName: 核验接口
                  productType: API
                  industryCategory: 信息传输、软件和信息技术服务业
                  typeSpecific:
                    api:
                      swaggerFileContent: "openapi: 3.0.3\ninfo:\n  title: demo\n  version: 1.0.0\npaths: {}\n"
                      endpoints:
                        - id: ep-1
                          method: POST
                          path: /enterprise/security/verify
                          summary: 企业安全信息核验
      responses:
        "200":
          description: 已创建并产生第 1 版上链
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
        "400":
          description: 格式非法或校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                badCode:
                  value:
                    code: ERR_PRODUCT_CODE_FORMAT
                    message: 产品编码格式非法，须符合 {DOMAIN}-{FEATURE}-{NNNN}
                    data: null
                    correlationId: "corr-prod-fmt-1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 编码冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                conflict:
                  value:
                    code: ERR_PRODUCT_CODE_CONFLICT
                    message: 产品编码已存在
                    data: null
                    correlationId: "corr-prod-dup-1"

  /catalog/products/{productId}:
    get:
      tags: [catalog]
      summary: 产品详情
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: 详情（分组字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [catalog]
      summary: 编辑数据产品（ADMIN 本企业 / PROVIDER 本人；跨企/USER → 403）
      description: |
        ADMIN 可写本企业产品；PROVIDER 仅 create_by=当前用户；跨企业 / 空归属 / USER → ERR_FORBIDDEN（403）。
        授权 scope **仅**信 SessionPrincipal。
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "200":
          description: 已更新并追加上链版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
        "400":
          description: 编码格式或 OQ-004
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                badCode:
                  value:
                    code: ERR_PRODUCT_CODE_FORMAT
                    message: 产品编码格式非法，须符合 {DOMAIN}-{FEATURE}-{NNNN}
                    data: null
                    correlationId: "corr-prod-fmt-2"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 编码冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                conflict:
                  value:
                    code: ERR_PRODUCT_CODE_CONFLICT
                    message: 产品编码已存在
                    data: null
                    correlationId: "corr-prod-dup-2"
    delete:
      tags: [catalog]
      summary: 删除数据产品（ADMIN 本企业 / PROVIDER 本人；跨企/USER → 403）
      description: |
        ADMIN 可删本企业产品；PROVIDER 仅 create_by=当前用户；跨企业 / USER → ERR_FORBIDDEN（403）。
        不存在 → 404。逻辑删除。
      operationId: deleteProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEmpty"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /chain/products/{productId}/versions:
    get:
      tags: [chain]
      summary: 产品上链版本列表（最新优先）
      operationId: listChainVersions
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseChainVersionList"

  /chain/versions/{versionId}/snapshot:
    get:
      tags: [chain]
      summary: 按 versionId 读取完整目录快照
      operationId: getChainSnapshot
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 不可变目录快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseChainSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalog/maintenance/entries:
    get:
      tags: [catalog]
      summary: 目录维护列表（条目≡数据产品；REQ-CAT-007 / REQ-CAT-017）
      description: |
        硬冻结 query **scope=full|myCatalog**（OpenAPI enum）：
        - scope=full：ADMIN **全平台**目录维护（/catalog/maintenance）；PROVIDER → 403
        - scope=myCatalog：ADMIN **本企业** / PROVIDER **ownCreateBy**（/my-catalog）；USER → 403
        授权 scope **仅**信 SessionPrincipal；客户端 enterpriseId **不得**作授权依据。
      operationId: listMaintenanceEntries
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [full, myCatalog]
          description: full=全量目录维护；myCatalog=我的目录（ADMIN 本企业 / PROVIDER 本人 create_by）
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, MAINTAINED, PENDING]
            default: ALL
        - name: l1CategoryId
          in: query
          schema: { type: string }
        - name: l2CategoryId
          in: query
          schema: { type: string }
        - name: l3CategoryId
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: 分页列表（page/pageSize/total）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaintenancePage"
        "403":
          $ref: "#/components/responses/Forbidden"

  /catalog/maintenance/entries/{productId}:
    put:
      tags: [catalog]
      summary: 单条目录维护关联（挂三级）
      description: |
        scope 规则同 listMaintenanceEntries（full vs myCatalog）。
        ADMIN scope=full 可维护任意产品；ADMIN scope=myCatalog 限本企业；PROVIDER 仅 myCatalog + ownCreateBy。
        空/异主 → 403 ERR_FORBIDDEN；无角色权限（USER）→ 403 ERR_MAINTENANCE_FORBIDDEN。
      operationId: updateMaintenanceEntry
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceAssociate"
      responses:
        "200":
          description: 已关联
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaintenanceEntry"
        "400":
          description: 非三级叶节点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                leafRequired:
                  value:
                    code: ERR_CATEGORY_LEAF_REQUIRED
                    message: 产品须挂载三级分类节点
                    data: null
                    correlationId: "corr-maint-leaf-1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalog/maintenance/entries/batch:
    post:
      tags: [catalog]
      summary: 批量目录维护关联
      description: |
        scope 规则同 listMaintenanceEntries（full vs myCatalog）。
        ADMIN scope=full 可批量维护任意产品；myCatalog / PROVIDER 逐条校验 create_by 与本企业 scope，越权条目进入 failures。
        无角色权限（USER）→ 403 ERR_MAINTENANCE_FORBIDDEN。
      operationId: batchUpdateMaintenanceEntries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceBatchAssociate"
      responses:
        "200":
          description: 批量结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseMaintenanceBatchResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /catalog/products/import/template:
    get:
      tags: [catalog]
      summary: 下载批量导入模板（xlsx/csv 列头）
      operationId: getImportTemplate
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        "200":
          description: 模板文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary

  /catalog/products/import:
    post:
      tags: [catalog]
      summary: 同步批量导入产品（ADMIN 本企业 / PROVIDER；REQ-CAT-008）
      description: |
        ADMIN 与 PROVIDER 可导入：ADMIN 限本企业；PROVIDER ownCreateBy。USER → ERR_FORBIDDEN（403）。
        UI 宿主为「我的数据产品」。授权 scope **仅**信 SessionPrincipal。
        请求级失败（整单拒绝）：文件 >10MB → ERR_IMPORT_FILE_TOO_LARGE；
        无法解析/非 xlsx|csv → ERR_IMPORT_FORMAT_INVALID；
        可解析但列名行集合 ≠ v0729 权威 ImportTemplateColumns → ERR_IMPORT_TEMPLATE_UNSUPPORTED。
        HTTP 为错误响应，无部分写入；不得伪装为行级结果态。
        行级失败：文件已接受并处理完后返回成功 envelope + successCount/failureCount/reportId；
        failureCount>0 时 reportId 必填。ERR_IMPORT_ROW_INVALID 仅作报告内原因码。
        行业分类列语义：GB/T 4754 门类中文原文枚举（对齐 v0729 C 列 dataValidation，写入 industryCategory）；
        非法门类 → 行级失败（ERR_IMPORT_ROW_INVALID）。不再要求解析为三级叶子。
        模板无产品编码列时服务端按 DEC-WSC-001 自动生成。
      operationId: importProducts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ≤10MB；xlsx 或 csv
      responses:
        "200":
          description: 同步导入完成（可含部分行级失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseImportResult"
              examples:
                allSuccess:
                  summary: 全成功
                  value:
                    code: "0"
                    message: OK
                    data:
                      successCount: 10
                      failureCount: 0
                      reportId: null
                    correlationId: "corr-imp-ok"
                partial:
                  summary: 部分成功（行级）
                  value:
                    code: "0"
                    message: OK
                    data:
                      successCount: 7
                      failureCount: 3
                      reportId: "rep-20260730-001"
                    correlationId: "corr-imp-partial"
                allRowFail:
                  summary: 全失败（行级）
                  value:
                    code: "0"
                    message: OK
                    data:
                      successCount: 0
                      failureCount: 5
                      reportId: "rep-20260730-002"
                    correlationId: "corr-imp-rows"
        "400":
          description: 请求级拒绝（整单无写入）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                tooLarge:
                  summary: 文件超限
                  value:
                    code: ERR_IMPORT_FILE_TOO_LARGE
                    message: 导入文件超过 10MB
                    data: null
                    correlationId: "corr-imp-size"
                badFormat:
                  summary: 格式无法解析
                  value:
                    code: ERR_IMPORT_FORMAT_INVALID
                    message: 无法解析文件或非 xlsx/csv
                    data: null
                    correlationId: "corr-imp-fmt"
                templateUnsupported:
                  summary: 旧模板/非 v0729 列名行（文件级拒绝）
                  value:
                    code: ERR_IMPORT_TEMPLATE_UNSUPPORTED
                    message: 导入模板不受支持：表头须为 v0729 权威列名行
                    data: null
                    correlationId: "corr-imp-tpl"
        "403":
          $ref: "#/components/responses/Forbidden"

  /catalog/products/import/reports/{reportId}:
    get:
      tags: [catalog]
      summary: 下载导入错误报告（TTL≤24h；白名单字段）
      operationId: getImportErrorReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 错误报告（行号+产品编码+原因码/文案）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseImportErrorReport"
              examples:
                rows:
                  value:
                    code: "0"
                    message: OK
                    data:
                      reportId: "rep-20260730-001"
                      expiresAt: "2026-07-31T08:00:00Z"
                      rows:
                        - rowNumber: 4
                          productCode: "MED-EMR-0099"
                          reasonCode: ERR_IMPORT_ROW_INVALID
                          reasonMessage: 行业分类非法，须为 GB/T 4754 门类枚举：电子病历
                        - rowNumber: 8
                          productCode: "BAD-CODE"
                          reasonCode: ERR_PRODUCT_CODE_FORMAT
                          reasonMessage: 产品编码格式非法
                    correlationId: "corr-imp-rep"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 过期或未知 reportId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                notFound:
                  value:
                    code: ERR_IMPORT_REPORT_NOT_FOUND
                    message: 错误报告不存在或已过期
                    data: null
                    correlationId: "corr-imp-rep-404"


components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: WSC_SESSION
      description: |
        服务端会话 Cookie。登录后写入；登出立即失效。
        角色绑定在会话中；写 API 以服务端会话角色为准。
        角色/权限变更后须吊销或强制刷新旧会话。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: |
        可选等价方案：Bearer 令牌必须映射可吊销的服务端会话表。
        非「纯无状态 JWT」；吊销后写 API 必须拒绝。

  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          examples:
            unauth:
              value:
                code: "401"
                message: 未登录或会话已失效
                data: null
                correlationId: "corr-401"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          examples:
            forbidden:
              value:
                code: ERR_FORBIDDEN
                message: 当前角色无权执行该写操作
                data: null
                correlationId: "corr-403"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"

  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, data, correlationId]
      properties:
        code:
          type: string
          description: 成功为 "0"；业务错误为 ERR_* 或 HTTP 语义码字符串
        message:
          type: string
        data:
          nullable: true
        correlationId:
          type: string

    ApiResponseEmpty:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              nullable: true

    ApiResponseError:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            code:
              type: string
              enum:
                - ERR_PRODUCT_CODE_FORMAT
                - ERR_PRODUCT_CODE_CONFLICT
                - ERR_CATEGORY_HAS_PRODUCTS
                - ERR_CATEGORY_LEAF_REQUIRED
                - ERR_MAINTENANCE_FORBIDDEN
                - ERR_IMPORT_FILE_TOO_LARGE
                - ERR_IMPORT_FORMAT_INVALID
                - ERR_IMPORT_TEMPLATE_UNSUPPORTED
                - ERR_IMPORT_REPORT_NOT_FOUND
                - ERR_FORBIDDEN
                - ERR_ROLE_SWITCH_DISABLED
                - ERR_USER_USERNAME_CONFLICT
                - ERR_USER_NOT_FOUND
                - "401"
                - "404"
            data:
              nullable: true
              description: ERR_CATEGORY_HAS_PRODUCTS 时含 reason、productCount

    Role:
      type: string
      enum: [ADMIN, PROVIDER, USER]

    ProductType:
      type: string
      enum: [DATASET, REPORT, API, OTHER]
      description: |
        DATASET=数据集, REPORT=数据报告, API=数据接口, OTHER=其他数据产品。
        OTHER：允许 typeSpecific.other（含 contentDescription 及共用时间/地域）；
        不得再要求 OTHER 必须为空对象。

    DataSource:
      type: string
      enum: [SELF_PRODUCED, PUBLIC_COLLECT, AGREEMENT, DERIVED]

    DeliveryMethod:
      type: string
      enum: [API, FILE, SANDBOX, PRIVACY_COMPUTE]

    UpdateFrequency:
      type: string
      enum: [REALTIME, DAILY, WEEKLY, MONTHLY, YEARLY, ON_DEMAND, NO_UPDATE]
      description: |
        REALTIME=实时, DAILY=每日, WEEKLY=每周, MONTHLY=每月, YEARLY=每年,
        ON_DEMAND=按需, NO_UPDATE=不更新（V1.3 / OQ-V13-008）。

    LoginRequest:
      type: object
      required: [username, password]
      description: |
        登录仅接受 username + password。角色不得由客户端选择；
        会话角色仅来自 sys_user 账号绑定（V1.4 废止 LoginRequest.role）。
      properties:
        username: { type: string }
        password: { type: string, format: password }

    SwitchRoleRequest:
      type: object
      required: [role]
      description: 会话切角色请求体（端点始终 410；无成功路径）
      properties:
        role:
          $ref: "#/components/schemas/Role"

    Session:
      type: object
      required: [userId, displayName, role, enterpriseId, enterpriseName]
      properties:
        userId: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enterpriseId:
          type: string
          description: 企业 ID；mine/myCatalog/写 scope 单一真源（REQ-USER-002）
        enterpriseName: { type: string }

    AdminUser:
      type: object
      required: [userId, username, displayName, role, enterpriseId, enterpriseName, deleted]
      description: |
        用户管理响应模型。list/get/create/update 响应禁止出现 password / passwordHash。
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enterpriseId:
          type: string
          description: 用户归属企业 ID（REQ-USER-002）
        enterpriseName: { type: string }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminUserCreate:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        role: { $ref: "#/components/schemas/Role" }
        displayName: { type: string }
        enterpriseId:
          type: string
          description: 可选；默认继承操作者企业
        enterpriseName: { type: string }

    AdminUserUpdate:
      type: object
      description: |
        更新用户；软删权威形状为 deleted: true（本版不采用 DELETE）。
        password 仅作写输入，响应永不回显。
      properties:
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enterpriseId:
          type: string
          description: 用户归属企业 ID
        enterpriseName: { type: string }
        password: { type: string, format: password }
        deleted: { type: boolean }

    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"

    ApiResponseAdminUser:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminUser"

    ApiResponseAdminUserPage:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminUserPage"

    L2DistributionItem:
      type: object
      required: [code, name, count]
      properties:
        code: { type: string }
        name: { type: string }
        count: { type: integer }

    L2Distribution:
      type: object
      required: [totalProducts, items]
      properties:
        totalProducts:
          type: integer
          description: 真实产品总数（非 Top5 之和）
        items:
          type: array
          description: 按 count 降序的 L2 条目；消费方可取 Top5
          items:
            $ref: "#/components/schemas/L2DistributionItem"

    ApiResponseL2Distribution:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/L2Distribution"

    ApiResponseSession:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Session"

    OverviewMetrics:
      type: object
      required: [assetTotal, activeEnterprises, todayAttestations, updatedAt]
      properties:
        assetTotal: { type: integer, format: int64 }
        activeEnterprises: { type: integer, format: int64 }
        todayAttestations: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }

    ApiResponseOverviewMetrics:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OverviewMetrics"

    TrendPoint:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    OverviewTrend:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"

    ApiResponseOverviewTrend:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OverviewTrend"

    TopItem:
      type: object
      required: [productName, count]
      properties:
        productId: { type: string }
        productName: { type: string }
        count: { type: integer }

    OverviewTop:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/TopItem"

    ApiResponseOverviewTop:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OverviewTop"

    StreamEventType:
      type: string
      enum: [CATALOG_REGISTER, DATA_REGISTER, TRADE_ORDER]

    StreamEvent:
      type: object
      required: [type, subject, actionSummary, relativeTime, occurredAt, chainRecordId]
      properties:
        type: { $ref: "#/components/schemas/StreamEventType" }
        subject: { type: string }
        actionSummary: { type: string }
        relativeTime: { type: string }
        occurredAt: { type: string, format: date-time }
        chainRecordId: { type: string }

    OverviewStream:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StreamEvent"

    ApiResponseOverviewStream:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OverviewStream"

    DistributionSlice:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: number }

    OverviewDistribution:
      type: object
      required: [byIndustry, byRegion]
      properties:
        byIndustry:
          type: array
          items:
            $ref: "#/components/schemas/DistributionSlice"
        byRegion:
          type: array
          items:
            $ref: "#/components/schemas/DistributionSlice"

    ApiResponseOverviewDistribution:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OverviewDistribution"

    Category:
      type: object
      required: [id, name, level]
      properties:
        id: { type: string }
        name: { type: string }
        level:
          type: string
          enum: [L1, L2, L3]
          description: L1=空间 L2=行业 L3=子类
        parentId:
          type: string
          nullable: true
        pathLabels:
          type: array
          items: { type: string }
          description: 可选；自根到本节点的名称路径

    CategoryWrite:
      type: object
      required: [name, level]
      properties:
        name: { type: string }
        level:
          type: string
          enum: [L1, L2, L3]
        parentId:
          type: string
          nullable: true
          description: L2 父为 L1；L3 父为 L2；L1 省略

    ApiResponseCategory:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Category"

    ApiResponseCategoryList:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Category"

    ProductCode:
      type: string
      pattern: '^[A-Z0-9]+-[A-Z0-9]+-[0-9]{4,}$'
      description: DEC-WSC-001 `{DOMAIN}-{FEATURE}-{NNNN}`
      example: MED-EMR-0002

    ApiEndpointParameter:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        required: { type: boolean }
        description: { type: string }

    ApiEndpointResponse:
      type: object
      properties:
        code: { type: string }
        description: { type: string }

    ApiEndpoint:
      type: object
      properties:
        id: { type: string }
        method: { type: string, description: "GET|POST|PUT|DELETE|PATCH 等" }
        path: { type: string }
        summary: { type: string }
        description: { type: string }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ApiEndpointParameter" }
        responses:
          type: array
          items: { $ref: "#/components/schemas/ApiEndpointResponse" }
        responseBodySchema: { type: string }
        requestBodySchema: { type: string }

    TypeSpecificApi:
      type: object
      description: |
        数据接口专属。归档真源 swaggerFileContent；派生存贮 endpoints[]。
        写冲突（二者均非空且不一致）时以客户端 endpoints 为准，禁止服务端静默重算覆盖。
        兼容旧字段 endpoint（非唯一真源）。
      properties:
        swaggerFileContent: { type: string, description: 原始 OpenAPI/Swagger 文本；可空 }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/ApiEndpoint" }
        fieldDescription: { type: string }
        dataSample: { type: string }
        timeRange: { type: string }
        regionScope: { type: string }
        endpoint: { type: string, description: 兼容旧字段；可读；写非唯一真源 }

    TypeSpecificDataset:
      type: object
      properties:
        timeRange: { type: string }
        regionScope: { type: string }
        dataScale: { type: string }
        dataForm: { type: string, description: 图片/文本/视频/音频/表格/其他 }
        fieldDescription: { type: string }
        dataSample: { type: string }

    TypeSpecificReportOrOther:
      type: object
      description: report 与 other 均允许 contentDescription + 共用时间/地域
      properties:
        timeRange: { type: string }
        regionScope: { type: string }
        contentDescription: { type: string }

    TypeSpecificFields:
      type: object
      description: |
        按 productType 择一填充 api / dataset / report / other。
        OTHER 允许 other.contentDescription 及共用时间/地域（修订 OQ-004）；
        不再要求 OTHER 必须为空对象。
      properties:
        dataset:
          $ref: "#/components/schemas/TypeSpecificDataset"
        report:
          $ref: "#/components/schemas/TypeSpecificReportOrOther"
        api:
          $ref: "#/components/schemas/TypeSpecificApi"
        other:
          $ref: "#/components/schemas/TypeSpecificReportOrOther"

    IndustryCategory:
      type: string
      description: |
        GB/T 4754—2017 门类中文原文（产品字段，非目录树节点；DEC-WSC-006）。
        枚举对齐 v0729 模板「行业分类」列 dataValidation。
      enum:
        - 农、林、牧、渔业
        - 采矿业
        - 制造业
        - 电力、热力、燃气及水生产和供应业
        - 建筑业
        - 批发和零售业
        - 交通运输、仓储和邮政业
        - 住宿和餐饮业
        - 信息传输、软件和信息技术服务业
        - 金融业
        - 房地产业
        - 租赁和商务服务业
        - 科学研究和技术服务业
        - 水利、环境和公共设施管理业
        - 居民服务、修理和其他服务业
        - 教育
        - 卫生和社会工作
        - 文化、体育和娱乐业
        - 公共管理、社会保障和社会组织
        - 国际组织

    ProductWrite:
      type: object
      required: [productCode, productName, productType, industryCategory]
      properties:
        productCode:
          $ref: "#/components/schemas/ProductCode"
        productName: { type: string }
        productType:
          $ref: "#/components/schemas/ProductType"
        industryCategory:
          $ref: "#/components/schemas/IndustryCategory"
        l3CategoryId:
          type: string
          nullable: true
          description: 可选目录树三级挂载；非行业分类语义；可空（方案 A）
        businessCategory: { type: string }
        businessSubCategory: { type: string }
        dataSource: { $ref: "#/components/schemas/DataSource" }
        updateFrequency: { $ref: "#/components/schemas/UpdateFrequency" }
        deliveryMethod: { $ref: "#/components/schemas/DeliveryMethod" }
        involvesPersonalInfo: { type: boolean }
        involvesPublicData: { type: boolean }
        billingMethod: { type: string }
        price: { type: string }
        supplierName: { type: string }
        supplierCreditCode:
          type: string
          description: 供应商信用代码（敏感；日志禁止明文）
        propertyRightsType: { type: string }
        tags:
          type: array
          items: { type: string }
        summary: { type: string }
        scenario: { type: string }
        typeSpecific:
          $ref: "#/components/schemas/TypeSpecificFields"

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductWrite"
        - type: object
          required: [id, chainCount]
          properties:
            id: { type: string }
            chainCount: { type: integer }
            categoryPath: { type: string }
            latestVersionNo: { type: integer }
            createBy:
              type: string
              nullable: true
              description: 创建者 userId（审计/归属字段，非本企业 scope 判定依据）。本企业产品范围见 `GET /catalog/products` 的 `mine` 参数（enterpriseId 比较，非 create_by-only；REQ-CAT-016）。空/缺失不可被 PROVIDER 冒领
            updateBy:
              type: string
              nullable: true
              description: 最近操作人 userId（服务端审计字段；客户端 body 不得覆盖）
            createByName:
              type: string
              nullable: true
              description: 创建人显示名（优先于 createBy；找不到用户时回退 userId）
            updateByName:
              type: string
              nullable: true
              description: 操作人显示名（优先于 updateBy；找不到用户时回退 userId）
            updatedAt: { type: string, format: date-time }

    ProductPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        l3Counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 当前筛选条件下各 L3 全集条数。键为 l3CategoryId，未分类为 `__uncategorized__`。分页不影响。

    ApiResponseProduct:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Product"

    ApiResponseProductPage:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ProductPage"

    ChainVersion:
      type: object
      required: [versionId, versionNo, timestamp, metadataHash, ownerDID, certificate]
      properties:
        versionId: { type: string }
        versionNo: { type: integer }
        timestamp: { type: string, format: date-time }
        metadataHash:
          type: string
          description: 日志禁止明文或仅截断指纹
        ownerDID:
          type: string
          description: 日志禁止明文或仅截断指纹
        certificate:
          type: object
          required: [owner]
          properties:
            owner: { type: string }
            timestamp: { type: string, format: date-time }

    ApiResponseChainVersionList:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChainVersion"

    CatalogSnapshot:
      type: object
      description: |
        版本化不可变目录快照。字段覆盖 REQ-CAT-004 分组或文档化子集：
        基础信息、供应商、数据产权、类型专属（含 OTHER.contentDescription）、标签、简介、场景。
      required: [versionId, productCode, productName, productType, capturedAt]
      properties:
        versionId: { type: string }
        productCode: { $ref: "#/components/schemas/ProductCode" }
        productName: { type: string }
        productType: { $ref: "#/components/schemas/ProductType" }
        categoryPath:
          type: string
          description: 三级分类完整路径，如「可信空间/金融/征信」
        categoryPathParts:
          type: object
          description: 存证快照三级路径字段（L1/L2/L3）
          properties:
            l1: { type: string }
            l2: { type: string }
            l3: { type: string }
        basicInfo:
          type: object
          additionalProperties: true
        supplierInfo:
          type: object
          additionalProperties: true
        propertyRights:
          type: object
          additionalProperties: true
        typeSpecific:
          $ref: "#/components/schemas/TypeSpecificFields"
        tags:
          type: array
          items: { type: string }
        summary: { type: string }
        scenario: { type: string }
        capturedAt: { type: string, format: date-time }
        attestation:
          type: object
          properties:
            metadataHash: { type: string }
            ownerDID: { type: string }
            timestamp: { type: string, format: date-time }
            certificate:
              type: object
              properties:
                owner: { type: string }

    ApiResponseChainSnapshot:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CatalogSnapshot"

    MaintenanceStatus:
      type: string
      enum: [PENDING, MAINTAINED]
      description: 待关联 / 已维护；目录维护条目 ≡ 数据产品

    MaintenanceEntry:
      type: object
      description: 与 Product 同一资源 id/productCode（不得拆两套冲突实体）
      required: [id, productCode, productName, maintenanceStatus]
      properties:
        id: { type: string }
        productCode: { $ref: "#/components/schemas/ProductCode" }
        productName: { type: string }
        maintenanceStatus: { $ref: "#/components/schemas/MaintenanceStatus" }
        l3CategoryId: { type: string, nullable: true }
        categoryPath: { type: string, nullable: true }

    MaintenancePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceEntry"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }

    MaintenanceAssociate:
      type: object
      required: [l3CategoryId]
      properties:
        l3CategoryId:
          type: string
          description: 目标三级节点 id

    MaintenanceBatchAssociate:
      type: object
      required: [productIds, l3CategoryId]
      properties:
        productIds:
          type: array
          items: { type: string }
          minItems: 1
        l3CategoryId: { type: string }

    MaintenanceBatchResult:
      type: object
      required: [successCount, failureCount]
      properties:
        successCount: { type: integer }
        failureCount: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              reasonCode: { type: string }
              reasonMessage: { type: string }

    ApiResponseMaintenanceEntry:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MaintenanceEntry"

    ApiResponseMaintenancePage:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MaintenancePage"

    ApiResponseMaintenanceBatchResult:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MaintenanceBatchResult"

    ImportResult:
      type: object
      required: [successCount, failureCount]
      properties:
        successCount: { type: integer }
        failureCount: { type: integer }
        reportId:
          type: string
          nullable: true
          description: failureCount>0 时必填；全成功可空

    ImportTemplateColumns:
      type: object
      description: |
        v0729 权威列名行（xlsx 第 2 行；分组行不参与等值判定）。
        V1.1 最小列 example（含产品编码、数据来源/个信等）已废止。
        模板无产品编码列；编码由服务端按 DEC-WSC-001 自动生成。
        行业分类列：GB/T 4754 门类中文原文枚举（写入 industryCategory；非三级叶子）。
      properties:
        columns:
          type: array
          items: { type: string }
          example:
            - 产品名称（必填）
            - 产品类型（必填）
            - 行业分类（必填）
            - 产品简介（必填）
            - 交付方式
            - 时间范围
            - 地域范围
            - 更新频率
            - 接口定义
            - 字段描述
            - 数据样例
            - 数据规模
            - 数据形态
            - 数据内容描述

    ImportErrorRow:
      type: object
      required: [rowNumber, reasonCode, reasonMessage]
      properties:
        rowNumber: { type: integer }
        productCode: { type: string, nullable: true }
        reasonCode:
          type: string
          description: 报告内原因码；含 ERR_IMPORT_ROW_INVALID（不作整单 HTTP code）
        reasonMessage: { type: string }

    ImportErrorReport:
      type: object
      required: [reportId, expiresAt, rows]
      properties:
        reportId: { type: string }
        expiresAt: { type: string, format: date-time }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportErrorRow"

    ApiResponseImportResult:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ImportResult"

    ApiResponseImportErrorReport:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ImportErrorReport"

