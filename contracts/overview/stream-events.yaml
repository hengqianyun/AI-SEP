# wsc-contracts@1.1.0 — OVW 动态流事件契约
# 对齐 PLAN-WSC-1.1 §3.1 / REQ-OVW-004
# V1 禁止依赖未实现的登记/订单业务 API；使用投影表或 seed/fixture/模拟写入

version: "1.1.0"
package: wsc-contracts

eventTypes:
  - CATALOG_REGISTER  # 目录登记
  - DATA_REGISTER     # 数据登记（Out-of-Scope 业务；流中可展示文案）
  - TRADE_ORDER       # 交易订单（Out-of-Scope 业务；流中可展示文案）

fields:
  - name: type
    required: true
    description: 事件类型枚举（上表）
  - name: subject
    required: true
    description: 主体（企业/产品/账户等可读标识）
  - name: actionSummary
    required: true
    description: 动作摘要
  - name: relativeTime
    required: true
    description: 相对时间展示文案或可由 occurredAt 派生
  - name: occurredAt
    required: true
    description: 绝对时间（ISO-8601），列表按此倒序
  - name: chainRecordId
    required: true
    description: 上链记录标识（哈希或等价 ID）

v1Supply:
  mode: fixture_or_projection
  description: |
    V1 数据供给：只读投影表 overview_stream_event，或测试 seed/fixture/模拟写入适配。
    禁止调用未实现的数据登记/交易订单业务 API 来生成流事件。
  fixtureHint: tests/ 或 backend seed 可直接 INSERT 三类 type，断言倒序与字段齐全

defaultLimit: 10
