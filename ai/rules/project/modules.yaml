# modules.yaml — WSC MODULE 码表

projectId: WSC

modules:
  - code: SHELL
    name: 工作台壳层与导航
    paths:
      - frontend/src/features/shell/**
      - frontend/src/layouts/**
      - frontend/src/router/**
    ownerRole: techLead

  - code: RBAC
    name: 角色与鉴权
    paths:
      - frontend/src/features/auth/**
      - backend/src/main/java/**/rbac/**
      - backend/src/main/java/**/security/**
    ownerRole: techLead

  - code: OVW
    name: 总览与运营指标
    paths:
      - frontend/src/features/overview/**
      - backend/src/main/java/**/overview/**
    ownerRole: techLead

  - code: CAT
    name: 数据目录与产品
    paths:
      - frontend/src/features/catalog/**
      - backend/src/main/java/**/catalog/**
    ownerRole: techLead

  - code: CHAIN
    name: 上链存证与权属
    paths:
      - frontend/src/features/chain/**
      - backend/src/main/java/**/chain/**
    ownerRole: techLead
