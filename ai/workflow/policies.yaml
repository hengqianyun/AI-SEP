# 项目工作流策略（实例化时按项目裁剪）
# 填写请复制同目录 POLICIES-TEMPLATE.yaml。

projectId: REPLACE_ME
workflowId: ai-software-delivery
workflowVersion: 1.0.0

planningCommittee:
  maxRounds: 5
  requiredRoles:
    - productAnalyst
    - solutionArchitect
    - qaStrategist
    - parallelPlanner
    - planEditor
  optionalRoles:
    # enabled=false 时必须填写 omitReason
    uxUiPlanner:
      enabled: true
      omitReason: ""
    apiDataDesigner:
      enabled: true
      omitReason: ""
    securityOperations:
      enabled: true
      omitReason: ""

codeReview:
  maxRounds: 5
  passWhen: no-p0-or-p1

riskTriggers:
  # 实例化时按真实变更类型增删
  securityReviewer:
    - auth-model-change
    - new-public-endpoint
    - handles-pii
  migrationReviewer:
    - schema-migration
    - data-backfill

release:
  requireHumanApproval: true
  approverIdentity: maintainer
  requireIntegrationReview: true
  requireAllP0Verified: true

escalation:
  onPlanningRoundLimit: productOwner
  onReviewRoundLimit: techLead
  onSecurityResidualRisk: securityOperationsOwner
  onReleaseGate: maintainer
  responseSlaHours: 24

isolation:
  mode: branch # branch | worktree | other
  notes: ""

learning:
  minIndependentEvents: 3
  minConfidence: 4
  scoreThreshold: 15
  requireHumanApproval: true
  approvers:
    global: platform
    organization: architecture-committee
    project: techLead
