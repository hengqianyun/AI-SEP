# 项目工作流策略 — WSC 试点
# 填写请复制同目录 POLICIES-TEMPLATE.yaml。

projectId: WSC
workflowId: ai-software-delivery
workflowVersion: 1.0.0

planningCommittee:
  maxRounds: 5
  requiredRoles:
    - productAnalyst
    - solutionArchitect
    - qaStrategist
    - parallelPlanner
    - planEditor
  optionalRoles:
    uxUiPlanner:
      enabled: true
      omitReason: ""
    apiDataDesigner:
      enabled: true
      omitReason: ""
    securityOperations:
      enabled: true
      omitReason: ""

codeReview:
  maxRounds: 5
  passWhen: no-p0-or-p1

riskTriggers:
  securityReviewer:
    - auth-model-change
    - new-public-endpoint
    - handles-pii
  migrationReviewer:
    - schema-migration
    - data-backfill

release:
  requireHumanApproval: true
  approverIdentity: maintainer
  requireIntegrationReview: true
  requireAllP0Verified: true

escalation:
  onPlanningRoundLimit: productOwner
  onReviewRoundLimit: techLead
  onSecurityResidualRisk: securityOperationsOwner
  onReleaseGate: maintainer
  responseSlaHours: 24

isolation:
  mode: branch
  notes: "WSC 试点：半自动编排，不依赖 Adapter 一键启动"

learning:
  minIndependentEvents: 3
  minConfidence: 4
  scoreThreshold: 15
  requireHumanApproval: true
  approvers:
    global: platform
    organization: architecture-committee
    project: techLead
