spring:
  application:
    name: wsc-backend
  datasource:
    url: jdbc:h2:mem:wsc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Default profile uses in-memory H2 so scaffold compiles/starts without local PG.
# For PostgreSQL 16, copy application-local.example.yml → application-local.yml
# and run with --spring.profiles.active=local
