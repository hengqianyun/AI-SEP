name: ${COMPOSE_PROJECT_NAME:-data-chain-demo}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: data-chain-backend:${IMAGE_TAG:-demo}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: "8080"
      WSC_CORS_ALLOWED_ORIGINS: ${WSC_CORS_ALLOWED_ORIGINS:-http://localhost:18080}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: "true"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      KNIFE4J_ENABLE: "false"
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - data-chain
    logging: *default-logging

  frontend:
    image: data-chain-frontend:${IMAGE_TAG:-demo}
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-../../data-chain-static}
      dockerfile: ${FRONTEND_DOCKERFILE:-../data-chain/deploy/frontend.Dockerfile}
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_BASE: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data-chain
    logging: *default-logging

networks:
  data-chain:
    driver: bridge

