server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data-chain-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:58.33.102.13}:${DB_PORT:30116}/${DB_NAME:data_chain}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:data_chain}
    password: ${DB_PASSWORD:KRmrjLfAS6BT5tsN}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:sql/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    validate-migration-naming: true
  redis:
    host: ${REDIS_HOST:58.33.102.13}
    port: ${REDIS_PORT:16379}
    password: ${REDIS_PASSWORD:PyV_7ITZEWuGZMHi}
    database: ${REDIS_DATABASE:5}
  sql:
    init:
      mode: never
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 前后端分仓部署时配置前端 Origin（逗号分隔）
wsc:
  cors:
    allowed-origins: ${WSC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ChainMP 信息存证；默认使用本地模拟适配器，生产环境通过环境变量开启真实上链。
chainmp:
  # 是否调用真实 ChainMP 接口：false 时完全不请求远端服务。
  enabled: ${CHAINMP_ENABLED:true}
  # 是否允许使用 mock 上链结果：
  # - enabled=false 时，true=直接使用 mock，false=上链任务失败；
  # - enabled=true 时，true=真实提交/查询重试耗尽后降级为 mock，false=重试耗尽后任务失败。
  # 正式环境若不允许模拟凭证，建议设置为 false。
  mock-enabled: ${CHAINMP_MOCK_ENABLED:true}
  base-url: ${CHAINMP_BASE_URL:http://172.20.105.190:3000}
  app-id: ${CHAINMP_APP_ID:}
  app-secret: ${CHAINMP_APP_SECRET:}
  connect-timeout-seconds: ${CHAINMP_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${CHAINMP_READ_TIMEOUT_SECONDS:10}
  submit-max-attempts: ${CHAINMP_SUBMIT_MAX_ATTEMPTS:3}
  query-max-attempts: ${CHAINMP_QUERY_MAX_ATTEMPTS:5}
  retry-delay-millis: ${CHAINMP_RETRY_DELAY_MILLIS:2000}

management:
  health:
    # 当前业务未使用 Redis。禁用 Redis 健康检查，避免 /actuator/health 为探活创建
    # 一条长期空闲的 Lettuce 连接，并在远端网络设备回收连接后持续触发自动重连。
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn

logging:
  level:
    root: INFO
    com.shdata.datachain: INFO

---
# Profile: offline compile/smoke without MySQL/Redis (H2)
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:data_chain;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:sql/migration
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
chainmp:
  enabled: false
